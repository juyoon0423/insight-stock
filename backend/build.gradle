plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.insightstock'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'me.paulschwarz:spring-dotenv:5.1.0'
	implementation 'com.pgvector:pgvector:0.1.6'
	// 자체 발급/자체 검증 JWT - 발급자와 검증자가 같은 단일 백엔드라 OAuth2 리소스 서버
	// 모델(외부 IdP 검증용, JWKSource 구성 필요)보다 직접 필터를 쓰는 이 조합이 더 단순하다.
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// OpenAI 임베딩 API 호출 전, 청크별 정확한 토큰 수를 로컬에서 계산하기 위한 tiktoken(cl100k_base)
	// 호환 라이브러리. 8,191 토큰 초과 청크를 API 호출 전에 걸러내고 chunks.token_count를 정확히 채운다.
	implementation 'com.knuddels:jtokkit:1.1.0'
	// 무중단(Blue-Green) 배포 중 인스턴스가 잠깐 2개 뜨는 구간에 같은 @Scheduled 배치가
	// 양쪽에서 동시 실행되는 걸 막기 위한 분산 락. Postgres 테이블 하나(shedlock)를
	// 락 저장소로 쓰는 shedlock-provider-jdbc-template를 사용 - 이미 쓰고 있는 DB 외에
	// 새 인프라(Redis 등)를 추가로 안 붙여도 된다.
	implementation 'net.javacrumbs.shedlock:shedlock-spring:7.7.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.7.0'

	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	// 유료 외부 API(OpenAI 등)를 실제로 호출하는 @Tag("manual") 테스트는 기본 test에서
	// 제외한다 - CI/커밋마다 자동 실행되면 안 되기 때문(CLAUDE.md 참고). 수동 검증은
	// manualTest 태스크로만 돌린다.
	useJUnitPlatform {
		excludeTags 'manual'
	}
	environment "SPRINGDOTENV_DIRECTORY", ".."
	// ManualIT류 검증 테스트는 assert가 아니라 println 결과를 사람이 읽는 용도라 필요.
	testLogging {
		showStandardStreams = true
	}
}

tasks.register('manualTest', Test) {
	group = 'verification'
	description = '유료 외부 API(OpenAI 등)를 실제로 호출하는 @Tag("manual") 테스트만 실행한다. ' +
			'비용이 발생하므로 필요할 때 사람이 직접 실행할 것 - CI/자동 실행 대상 아님.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'manual'
	}
	environment "SPRINGDOTENV_DIRECTORY", ".."
	testLogging {
		showStandardStreams = true
	}
}

tasks.named('bootRun') {
	environment "SPRINGDOTENV_DIRECTORY", ".."
}
