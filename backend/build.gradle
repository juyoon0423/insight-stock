plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.insightstock'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'me.paulschwarz:spring-dotenv:5.1.0'
	implementation 'com.pgvector:pgvector:0.1.6'
	// OpenAI 임베딩 API 호출 전, 청크별 정확한 토큰 수를 로컬에서 계산하기 위한 tiktoken(cl100k_base)
	// 호환 라이브러리. 8,191 토큰 초과 청크를 API 호출 전에 걸러내고 chunks.token_count를 정확히 채운다.
	implementation 'com.knuddels:jtokkit:1.1.0'

	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	// 유료 외부 API(OpenAI 등)를 실제로 호출하는 @Tag("manual") 테스트는 기본 test에서
	// 제외한다 - CI/커밋마다 자동 실행되면 안 되기 때문(CLAUDE.md 참고). 수동 검증은
	// manualTest 태스크로만 돌린다.
	useJUnitPlatform {
		excludeTags 'manual'
	}
	environment "SPRINGDOTENV_DIRECTORY", ".."
	// ManualIT류 검증 테스트는 assert가 아니라 println 결과를 사람이 읽는 용도라 필요.
	testLogging {
		showStandardStreams = true
	}
}

tasks.register('manualTest', Test) {
	group = 'verification'
	description = '유료 외부 API(OpenAI 등)를 실제로 호출하는 @Tag("manual") 테스트만 실행한다. ' +
			'비용이 발생하므로 필요할 때 사람이 직접 실행할 것 - CI/자동 실행 대상 아님.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'manual'
	}
	environment "SPRINGDOTENV_DIRECTORY", ".."
	testLogging {
		showStandardStreams = true
	}
}

tasks.named('bootRun') {
	environment "SPRINGDOTENV_DIRECTORY", ".."
}
