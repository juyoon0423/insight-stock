spring:
  application:
    name: insight-stock
  datasource:
    url: jdbc:postgresql://localhost:5432/insight_stock
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # 기본값(10)에 암묵적으로 의존하지 않고 명시 - k6 부하테스트(backend/loadtest/)에서
      # 기본값 10으로는 동시 요청 100건 중 최대 100건이 커넥션을 기다리며 30초 타임아웃으로
      # 실패하는 걸 실측했다(HikariPool-1 ... waiting=100 로그). Postgres max_connections=100
      # (실측 확인, 이 DB는 백엔드 하나만 쓰므로 경쟁 없음)이고 목표 동시 사용자 10~50명을
      # 큐잉 없이 받아내면서 한도 안에 headroom을 남기는 값으로 50을 선택(docs/loadtest.md 참고).
      maximum-pool-size: 50
  jpa:
    hibernate:
      ddl-auto: validate
  elasticsearch:
    uris: http://localhost:9200

management:
  endpoints:
    web:
      exposure:
        include: health

dart:
  api:
    base-url: https://opendart.fss.or.kr/api
    key: ${DART_API_KEY}
  collector:
    # 10분마다 오늘 날짜 공시를 재조회. rcept_no 중복 체크로 걸러지므로 재조회해도 안전.
    fixed-delay-ms: 600000
  document-collector:
    # 10분마다 PENDING 공시를 batch-size건씩 처리.
    fixed-delay-ms: 600000
    batch-size: 20

corp-code-sync:
  collector:
    # 118,535건 전체를 매번 다시 훑는 무거운 배치 - 다른 collector들처럼 검증 전엔 꺼둔다.
    enabled: false
    # 하루 1회, 새벽 3시(KST) - list/document(10분 간격)와 달리 전체 스냅샷이라 자주 돌 필요 없음.
    cron: "0 0 3 * * *"

chunking:
  # 이 값 미만이면 구조 분할 없이 통째로 1개 청크로 저장한다.
  whole-document-char-threshold: 2000
  sliding-window:
    size: 800
    overlap: 150
  empty-content-filter:
    # 정형 서식 공시에 많은 "라벨만 있고 값은 없는" 표 청크를 걸러낸다.
    # 검색 품질을 보고 나중에 조정할 수 있도록 임계치를 설정값으로 뺐다.
    enabled: true
    min-length: 10
    min-meaningful-ratio: 0.3
  collector:
    # 표 압축(2단계)이 여전히 필요한지 판단할 때까지 비활성화 상태 유지.
    enabled: false
    # 10분마다 PARSED 공시를 batch-size건씩 청킹한다.
    fixed-delay-ms: 600000
    batch-size: 20

indexing:
  collector:
    # 검증 완료(파일럿 49건 + 전체 5,201건, ES 문서 수 일치 확인). 다른 스케줄러와
    # 같은 배치 크기로 운영값 유지.
    enabled: true
    fixed-delay-ms: 600000
    batch-size: 20

embedding:
  api:
    base-url: https://api.openai.com/v1
    key: ${OPENAI_API_KEY}
    # 타임아웃이 없으면 OpenAI가 응답을 안 줄 때 무기한 대기한다. 같은 API지만 호출 성격이
    # 달라 read timeout을 경로별로 분리했다(connect는 공통 - 연결 자체가 안 되는 상황은
    # 경로와 무관하게 빨리 포기). 타임아웃은 429와 달리 재시도하지 않는다.
    connect-timeout-ms: 5000
    single:
      # 질의 1건 임베딩(/search, /answers 전처리). 사용자가 화면 앞에서 기다리므로 짧게.
      # 초과 시 502/SEARCH_UNAVAILABLE.
      read-timeout-ms: 10000
    batch:
      # 색인용 배치(request-batch-size=100건/요청). 백그라운드 작업이고 요청이 크므로 길게.
      # 초과 시 해당 sub-batch만 실패로 기록되고 다음 주기에 다시 시도된다.
      read-timeout-ms: 60000
  model: text-embedding-3-small
  # OpenAI 임베딩 API 요청 1건에 담을 청크 수(비용 실측 결과 평균 654토큰/청크 기준
  # 100개 ≈ 65K토큰/요청 - 여유 있음. 2,048개인 API 배열 한도보다 훨씬 작게 잡아
  # 요청 1건 실패 시 손해를 제한).
  request-batch-size: 100
  rate-limit:
    # sub-batch(request-batch-size=100건, 실측 평균 663토큰/청크 기준 ≈ 66,340토큰/요청)
    # 사이 최소 간격. 관찰된 OpenAI TPM 한도(1,000,000)의 80%(800,000)를 넘지 않도록
    # 계산: 800,000 / 66,340 ≈ 분당 12회 → 60,000ms / 12 ≈ 5,000ms. 계정 등급이 바뀌어
    # TPM 한도가 달라지면 이 값도 다시 계산해야 한다(2026-07-27, 7일치 데이터 확대
    # 백필 중 429 폭주로 발견 - progress.md 참고).
    min-interval-ms: 5000
    # 그래도 429가 나면(청크가 평균보다 훨씬 클 때 등) 지수 백오프로 재시도.
    max-retries: 3
    initial-backoff-ms: 2000
  collector:
    # 전체 배치 완료(2026-07-22, 5,191건 전부 처리, 실패 0건) - 다시 비활성화 상태로 복귀.
    enabled: false
    fixed-delay-ms: 600000
    batch-size: 20

hybrid-search:
  # RRF 전에 각 검색(BM25/벡터)에서 가져올 후보 수. top-k만 가져오면 겹칠 여지가
  # 없어 RRF가 사실상 무의미해지므로 top-k보다 넉넉하게 잡는다.
  candidate-size: 50
  top-k: 10
  # RRF 상수(Cormack et al., 2009 권장값 - 순위 차이의 영향을 완만하게 만듦).
  rrf-k: 60
  executor:
    # 검색 1건당 키워드(ES)+벡터(pgvector) 태스크 2개가 이 풀을 공유한다. 기존 고정값
    # 4는 k6 부하테스트에서 명확한 병목으로 확인됐다(30 VU만으로도 p95 30초대, 성공률
    # 80%) - 벡터 태스크만 Hikari 커넥션을 점유하므로, 풀을 datasource.hikari.
    # maximum-pool-size(50)와 같은 크기로만 두면 DB와 무관한 키워드(ES) 태스크까지
    # 스레드풀 단에서 또 직렬화된다. "벡터용 50 + 키워드용 50"이 동시에 돌 수 있도록
    # Hikari 풀의 2배로 잡았다 - I/O 대기가 대부분이라 CPU 코어 수보다 많아도 안전하다
    # (docs/loadtest.md 참고).
    pool-size: 100
  dedup:
    # content가 완전히 동일한(공백만 다른 것도 포함) 청크를 대표 1건으로 합칠지 여부.
    # 2026-07-23 발견: 일괄신고/다회차 발행 관행 때문에 같은 문구가 여러 공시에
    # 반복 등장하는 경우가 있어(dart-findings.md 참고) top-K가 중복으로 채워지는
    # 문제를 완화한다. 2026-07-23 적용 전후 비교 검증 완료 후 true로 전환
    # (dart-findings.md 2-10, progress.md 참고).
    enabled: true

notification:
  collector:
    # watchlist에 등록된 회사의 신규 공시를 감지해 notification 행으로 만드는 배치.
    # 실제 검증(로컬 psql로 알림 생성/재실행 시 중복 방지 확인) 전까지는 다른 collector들과
    # 같은 패턴으로 기본 비활성화.
    enabled: false
    # 수집/청킹/색인과 같은 10분 간격 - 감지 쿼리 자체는 가볍지만(EXPLAIN ANALYZE 2.4ms,
    # progress.md 참고) 굳이 더 잦게 돌 이유가 없어 기존 관례를 그대로 따름.
    fixed-delay-ms: 600000

cors:
  # 로컬 개발 시 기본값은 Next.js 개발 서버 포트. 배포 환경에서는 CORS_ALLOWED_ORIGINS
  # 환경변수(.env)로 실제 프론트 도메인을 넣는다(콤마로 여러 개 가능).
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET}
  # 30분 - 짧게 잡아 유출 시 피해를 제한한다.
  access-token-expiry-ms: 1800000
  # 14일 - Stateless 방식(서버 저장 없음)이라 로그아웃 시 즉시 무효화는 안 되지만,
  # WatchList는 민감도가 낮아 지금은 이 정도로 충분하다고 판단(3단계 설계 논의 참고).
  refresh-token-expiry-ms: 1209600000

rag:
  chat:
    api:
      base-url: https://api.openai.com/v1
      key: ${OPENAI_API_KEY}
      # 타임아웃이 없으면 OpenAI가 응답을 안 줄 때 무기한 대기한다(화면이 그대로 멈춤).
      # read 30초: k6 부하테스트에서 /answers 정상 p95가 3.49초였으므로 정상 응답을
      # 오탐으로 끊을 일은 없으면서 무기한 대기는 확실히 막는 값. connect 5초: 연결
      # 자체가 안 되는 상황은 더 빨리 포기한다. 타임아웃 시 502/LLM_UNAVAILABLE.
      connect-timeout-ms: 5000
      read-timeout-ms: 30000
    # 비용 대비 검증에 충분한 품질부터 시작 - 품질 부족 확인되면 상위 모델로 교체
    # (질문당 예상 비용 ~$0.0015, 다른 모델로 바꿔도 실질적 예산 제약은 없음).
    model: gpt-4o-mini
    # 사실 근거 답변이 목적이라 창의성보다 일관성이 중요 - 낮게 고정.
    temperature: 0.0
    rate-limit:
      # OpenAI가 429(rate limit)를 주면 지수 백오프로 재시도한다(500ms -> 1000ms).
      # 사용자가 화면 앞에서 기다리는 요청이라 임베딩 배치(3회, 2000ms 시작)보다 훨씬
      # 짧게 잡았다 - 최악의 경우 추가 대기는 합계 1.5초. 재시도를 전부 소진하면
      # 429/LLM_RATE_LIMITED로 응답한다(k6 부하테스트에서 TPM 한도 429가 그대로
      # 502로 노출된 문제의 대응 - docs/loadtest.md 참고).
      max-retries: 2
      initial-backoff-ms: 500
