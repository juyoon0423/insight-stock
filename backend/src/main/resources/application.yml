spring:
  application:
    name: insight-stock
  datasource:
    url: jdbc:postgresql://localhost:5432/insight_stock
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  elasticsearch:
    uris: http://localhost:9200

management:
  endpoints:
    web:
      exposure:
        include: health

dart:
  api:
    base-url: https://opendart.fss.or.kr/api
    key: ${DART_API_KEY}
  collector:
    # 10분마다 오늘 날짜 공시를 재조회. rcept_no 중복 체크로 걸러지므로 재조회해도 안전.
    fixed-delay-ms: 600000
  document-collector:
    # 10분마다 PENDING 공시를 batch-size건씩 처리.
    fixed-delay-ms: 600000
    batch-size: 20

chunking:
  # 이 값 미만이면 구조 분할 없이 통째로 1개 청크로 저장한다.
  whole-document-char-threshold: 2000
  sliding-window:
    size: 800
    overlap: 150
  empty-content-filter:
    # 정형 서식 공시에 많은 "라벨만 있고 값은 없는" 표 청크를 걸러낸다.
    # 검색 품질을 보고 나중에 조정할 수 있도록 임계치를 설정값으로 뺐다.
    enabled: true
    min-length: 10
    min-meaningful-ratio: 0.3
  collector:
    # 표 압축(2단계)이 여전히 필요한지 판단할 때까지 비활성화 상태 유지.
    enabled: false
    # 10분마다 PARSED 공시를 batch-size건씩 청킹한다.
    fixed-delay-ms: 600000
    batch-size: 20

indexing:
  collector:
    # 검증 완료(파일럿 49건 + 전체 5,201건, ES 문서 수 일치 확인). 다른 스케줄러와
    # 같은 배치 크기로 운영값 유지.
    enabled: true
    fixed-delay-ms: 600000
    batch-size: 20

embedding:
  api:
    base-url: https://api.openai.com/v1
    key: ${OPENAI_API_KEY}
  model: text-embedding-3-small
  # OpenAI 임베딩 API 요청 1건에 담을 청크 수(비용 실측 결과 평균 654토큰/청크 기준
  # 100개 ≈ 65K토큰/요청 - 여유 있음. 2,048개인 API 배열 한도보다 훨씬 작게 잡아
  # 요청 1건 실패 시 손해를 제한).
  request-batch-size: 100
  collector:
    # 전체 배치 완료(2026-07-22, 5,191건 전부 처리, 실패 0건) - 다시 비활성화 상태로 복귀.
    enabled: false
    fixed-delay-ms: 600000
    batch-size: 20
